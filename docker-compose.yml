version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: floracycle_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: floracycle
      POSTGRES_USER: floracycle_user
      POSTGRES_PASSWORD: DEEPU@2006

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floracycle_user -d floracycle"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: floracycle_web
    restart: unless-stopped

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - media_files:/app/media
      - .:/app

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_files: